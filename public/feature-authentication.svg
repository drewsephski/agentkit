<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <!-- Green accent palette -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050507"/>
      <stop offset="50%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d992" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00a86b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00d992" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="glassSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d992"/>
      <stop offset="100%" stop-color="#00a86b"/>
    </linearGradient>
    
    <linearGradient id="buttonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,217,146,0.25)"/>
      <stop offset="100%" stop-color="rgba(0,168,107,0.15)"/>
    </linearGradient>
    
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="cardGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Transparent background - no fill -->
  
  <!-- Central green glow -->
  <ellipse cx="400" cy="225" rx="280" ry="200" fill="url(#greenGlow)" filter="url(#softGlow)"/>
  
  <!-- Title text -->
  <text x="400" y="40" font-family="system-ui, sans-serif" font-size="18" fill="#00d992" font-weight="600" text-anchor="middle">Secure Authentication</text>
  <text x="400" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#8a9199" text-anchor="middle">Multiple sign-in options with enterprise security</text>
  
  <!-- Floating nodes -->
  <g opacity="0.25">
    <circle cx="90" cy="70" r="4" fill="#00d992">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="85" r="5" fill="#00a86b">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,7; 0,0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="75" cy="375" r="3" fill="#00d992">
      <animateTransform attributeName="transform" type="translate" values="0,0; -5,0; 0,0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="725" cy="375" r="4" fill="#00a86b">
      <animateTransform attributeName="transform" type="translate" values="0,0; 5,0; 0,0" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Main Auth Card -->
  <g transform="translate(260, 80)">
    <!-- Outer glow -->
    <rect x="-8" y="-8" width="296" height="306" rx="20" fill="rgba(0,217,146,0.12)" filter="url(#cardGlow)"/>
    
    <!-- Card frame -->
    <rect x="0" y="0" width="280" height="290" rx="16" fill="rgba(10,10,12,0.9)" stroke="rgba(0,217,146,0.25)" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="290" rx="16" fill="url(#glassSurface)"/>
    
    <!-- Top highlight -->
    <path d="M16 1 H264" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-linecap="round"/>
    
    <!-- Header section with lock -->
    <rect x="0" y="0" width="280" height="75" rx="16" fill="rgba(5,5,7,0.6)"/>
    <rect x="0" y="58" width="280" height="20" fill="rgba(5,5,7,0.6)"/>
    
    <!-- Lock icon -->
    <g transform="translate(120, 15)">
      <rect x="0" y="12" width="40" height="30" rx="5" fill="none" stroke="url(#accentGreen)" stroke-width="2.5"/>
      <path d="M10 12 V 8 A 10 10 0 0 1 30 8 V 12" fill="none" stroke="url(#accentGreen)" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="20" cy="27" r="5" fill="#00d992">
        <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Input fields -->
    <g transform="translate(30, 92)">
      <!-- Email field -->
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" fill="#8a9199">Email</text>
      <rect x="0" y="8" width="220" height="42" rx="10" fill="rgba(5,5,7,0.5)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
      <text x="15" y="35" font-family="system-ui, sans-serif" font-size="13" fill="#c8c8c8">dev@example.com</text>
      <!-- Email icon -->
      <rect x="190" y="20" width="18" height="14" rx="3" stroke="rgba(0,217,146,0.5)" stroke-width="1.5" fill="none"/>
      <path d="M193 23 L199 29 L205 23" stroke="rgba(0,217,146,0.5)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Password field -->
      <text x="0" y="65" font-family="system-ui, sans-serif" font-size="11" fill="#8a9199">Password</text>
      <rect x="0" y="73" width="220" height="42" rx="10" fill="rgba(5,5,7,0.5)" stroke="url(#accentGreen)" stroke-width="1.5"/>
      <text x="15" y="100" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">••••••••</text>
      <!-- Password dots indicator -->
      <circle cx="175" cy="94" r="4" fill="#00d992"/>
      <circle cx="190" cy="94" r="4" fill="#00d992"/>
      <circle cx="205" cy="94" r="4" fill="#00d992"/>
    </g>
    
    <!-- Sign in button -->
    <g transform="translate(30, 238)">
      <rect x="0" y="0" width="220" height="42" rx="10" fill="url(#buttonGrad)" stroke="rgba(0,217,146,0.35)" stroke-width="1.5"/>
      <text x="110" y="26" font-family="system-ui, sans-serif" font-size="14" fill="#f2f2f2" font-weight="600" text-anchor="middle">Sign In</text>
    </g>
  </g>
  
  <!-- User profile card left -->
  <g transform="translate(50, 165)" opacity="0.6">
    <text x="50" y="-15" font-family="system-ui, sans-serif" font-size="10" fill="#8a9199" text-anchor="middle">User</text>
    <rect x="0" y="0" width="100" height="110" rx="12" fill="rgba(10,10,12,0.8)" stroke="rgba(0,217,146,0.18)" stroke-width="1"/>
    <!-- Avatar -->
    <circle cx="50" cy="35" r="22" stroke="rgba(0,217,146,0.35)" stroke-width="2" fill="none"/>
    <text x="50" y="42" font-family="system-ui, sans-serif" font-size="16" fill="#00d992" text-anchor="middle">👤</text>
    <!-- Connection line -->
    <line x1="100" y1="55" x2="200" y2="225" stroke="rgba(0,217,146,0.2)" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.5">
      <animate attributeName="stroke-dashoffset" values="0;10" dur="2s" repeatCount="indefinite"/>
    </line>
    <!-- Status -->
    <text x="50" y="95" font-family="system-ui, sans-serif" font-size="10" fill="#4ade80" text-anchor="middle">● Online</text>
  </g>
  
  <!-- OAuth providers panel right -->
  <g transform="translate(570, 130)" opacity="0.7">
    <text x="75" y="-15" font-family="system-ui, sans-serif" font-size="10" fill="#8a9199" text-anchor="middle">OAuth Providers</text>
    <rect x="0" y="0" width="150" height="210" rx="12" fill="rgba(10,10,12,0.8)" stroke="rgba(0,217,146,0.18)" stroke-width="1"/>
    <rect x="0" y="0" width="150" height="40" rx="12" fill="rgba(5,5,7,0.5)"/>
    <rect x="0" y="28" width="150" height="15" fill="rgba(5,5,7,0.5)"/>
    <text x="20" y="22" font-family="system-ui, sans-serif" font-size="11" fill="#8a9199">Sign in with</text>
    
    <!-- Google button -->
    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="110" height="38" rx="8" fill="rgba(5,5,7,0.5)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="40" y="24" font-family="system-ui, sans-serif" font-size="12" fill="#c8c8c8">Google</text>
    </g>
    
    <!-- GitHub button (active) -->
    <g transform="translate(20, 102)">
      <rect x="0" y="0" width="110" height="38" rx="8" fill="rgba(0,217,146,0.08)" stroke="rgba(0,217,146,0.3)" stroke-width="1.5"/>
      <text x="40" y="24" font-family="system-ui, sans-serif" font-size="12" fill="#00d992" font-weight="500">GitHub</text>
      <!-- Active indicator -->
      <circle cx="95" cy="19" r="4" fill="#00d992">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Twitter button -->
    <g transform="translate(20, 149)">
      <rect x="0" y="0" width="110" height="38" rx="8" fill="rgba(5,5,7,0.5)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="40" y="24" font-family="system-ui, sans-serif" font-size="12" fill="#6b7280">Twitter</text>
    </g>
  </g>
  
  <!-- Security badge bottom left -->
  <g transform="translate(60, 335)" opacity="0.5">
    <text x="30" y="-10" font-family="system-ui, sans-serif" font-size="10" fill="#8a9199" text-anchor="middle">Encrypted</text>
    <path d="M30 5 L55 17 V42 Q30 60 5 42 V17 Z" fill="rgba(0,217,146,0.12)" stroke="url(#accentGreen)" stroke-width="2"/>
    <path d="M22 35 L38 18" stroke="url(#accentGreen)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M22 35 L27 40" stroke="url(#accentGreen)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Database icon bottom right -->
  <g transform="translate(690, 335)" opacity="0.5">
    <text x="30" y="-10" font-family="system-ui, sans-serif" font-size="10" fill="#8a9199" text-anchor="middle">User DB</text>
    <ellipse cx="30" cy="18" rx="25" ry="10" stroke="url(#accentGreen)" stroke-width="2" fill="none"/>
    <path d="M5 18 V 38" stroke="url(#accentGreen)" stroke-width="2"/>
    <path d="M55 18 V 38" stroke="url(#accentGreen)" stroke-width="2"/>
    <path d="M5 38 Q30 50 55 38" stroke="url(#accentGreen)" stroke-width="2" fill="none"/>
    <path d="M5 28 Q30 40 55 28" stroke="url(#accentGreen)" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
  
  <!-- Floating particles -->
  <g opacity="0.45">
    <circle cx="165" cy="95" r="2.5" fill="#00d992">
      <animate attributeName="cy" values="95;80;95" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="635" cy="375" r="3" fill="#00a86b">
      <animate attributeName="cy" values="375;360;375" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="765" cy="105" r="2" fill="#00d992">
      <animate attributeName="cy" values="105;90;105" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>

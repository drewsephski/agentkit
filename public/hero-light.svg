<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Refined grid pattern -->
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(16, 185, 129, 0.04)" stroke-width="0.5"/>
    </pattern>
    
    <!-- Sophisticated light background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fafcfb"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    
    <!-- Premium card gradient -->
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    
    <!-- Vibrant video content gradient -->
    <linearGradient id="videoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="30%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    
    <!-- Active state gradient -->
    <linearGradient id="activeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    
    <!-- Frame thumbnail gradient -->
    <linearGradient id="frameGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    
    <!-- Premium shadow for depth -->
    <filter id="premiumShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="30" flood-color="rgba(0,0,0,0.08)"/>
    </filter>
    
    <!-- Inner depth for panels -->
    <filter id="innerDepth" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="blur"/>
      <feOffset dx="0" dy="2" result="offsetBlur"/>
      <feComposite in="offsetBlur" in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="#94a3b8" flood-opacity="0.15" result="shadowColor"/>
      <feComposite in="shadowColor" in2="shadowDiff" operator="in" result="innerShadow"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="innerShadow"/>
      </feMerge>
    </filter>
    
    <!-- Emerald glow for accents -->
    <filter id="emeraldGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feFlood flood-color="#10b981" flood-opacity="0.3" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="softGlow"/>
      <feMerge>
        <feMergeNode in="softGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Logo gradient -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    
    <!-- Subtle grain texture -->
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.02"/>
      </feComponentTransfer>
    </filter>
  </defs>
  
  <!-- Background layers -->
  <rect width="1920" height="1080" fill="url(#bgGradient)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" filter="url(#grain)"/>
  
  <!-- Decorative gradient orbs -->
  <circle cx="180" cy="180" r="450" fill="rgba(16, 185, 129, 0.15)" filter="blur(140px)"/>
  <circle cx="1720" cy="880" r="550" fill="rgba(6, 182, 212, 0.1)" filter="blur(160px)"/>
  <circle cx="960" cy="540" r="350" fill="rgba(16, 185, 129, 0.08)" filter="blur(120px)"/>
  
  <!-- Main Interface Container -->
  <g transform="translate(460, 80)">
    <!-- Card with layered shadows -->
    <rect x="4" y="4" width="992" height="692" rx="28" fill="rgba(0,0,0,0.04)" filter="url(#premiumShadow)"/>
    <rect x="0" y="0" width="1000" height="700" rx="28" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="2" y="2" width="996" height="696" rx="26" fill="none" stroke="rgba(16, 185, 129, 0.08)" stroke-width="1"/>
    
    <!-- Header section -->
    <rect x="0" y="0" width="1000" height="72" rx="28" fill="white"/>
    <rect x="0" y="48" width="1000" height="24" fill="white"/>
    <rect x="28" y="70" width="944" height="1" fill="#e2e8f0"/>
    
    <!-- Logo with icon -->
    <g transform="translate(28, 20)">
      <rect x="0" y="0" width="36" height="36" rx="10" fill="url(#logoGradient)" filter="url(#emeraldGlow)"/>
      <circle cx="18" cy="18" r="5" fill="white"/>
      <path d="M18 10v4m0 8v4m9-8h-4m-10 0H9" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="76" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#0f172a" letter-spacing="-0.3">AgentKit Video Studio</text>
    
    <!-- Status badge with pulse -->
    <g transform="translate(810, 20)">
      <rect x="0" y="0" width="150" height="36" rx="18" fill="#dcfce7" stroke="#10b981" stroke-width="1"/>
      <circle cx="24" cy="18" r="5" fill="#10b981"/>
      <circle cx="24" cy="18" r="5" fill="#10b981" opacity="0.3">
        <animate attributeName="r" values="5;12;5" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="38" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#059669">Generating</text>
    </g>
    
    <!-- Video Preview Area -->
    <g transform="translate(24, 88)">
      <rect x="0" y="0" width="680" height="420" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#innerDepth)"/>
      
      <!-- Video content -->
      <rect x="16" y="16" width="648" height="388" rx="12" fill="url(#videoGradient)"/>
      
      <!-- Dynamic wave visualization -->
      <g opacity="0.35" stroke="white" stroke-width="3" fill="none" stroke-linecap="round">
        <path d="M16 210 Q80 160, 160 210 T320 210 T480 210 T640 210 T664 210">
          <animate attributeName="d" values="M16 210 Q80 160, 160 210 T320 210 T480 210 T640 210 T664 210;M16 210 Q80 260, 160 210 T320 210 T480 210 T640 210 T664 210;M16 210 Q80 160, 160 210 T320 210 T480 210 T640 210 T664 210" dur="4s" repeatCount="indefinite"/>
        </path>
        <path d="M16 240 Q80 190, 160 240 T320 240 T480 240 T640 240 T664 240" opacity="0.6">
          <animate attributeName="d" values="M16 240 Q80 190, 160 240 T320 240 T480 240 T640 240 T664 240;M16 240 Q80 290, 160 240 T320 240 T480 240 T640 240 T664 240;M16 240 Q80 190, 160 240 T320 240 T480 240 T640 240 T664 240" dur="4s" repeatCount="indefinite" begin="0.5s"/>
        </path>
        <path d="M16 270 Q80 220, 160 270 T320 270 T480 270 T640 270 T664 270" opacity="0.4">
          <animate attributeName="d" values="M16 270 Q80 220, 160 270 T320 270 T480 270 T640 270 T664 270;M16 270 Q80 320, 160 270 T320 270 T480 270 T640 270 T664 270;M16 270 Q80 220, 160 270 T320 270 T480 270 T640 270 T664 270" dur="4s" repeatCount="indefinite" begin="1s"/>
        </path>
      </g>
      
      <!-- Video info overlay -->
      <rect x="40" y="340" width="340" height="64" rx="14" fill="rgba(255, 255, 255, 0.98)" stroke="#e2e8f0" stroke-width="1"/>
      <text x="60" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#0f172a">The Future of AI Agents</text>
      <text x="60" y="392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">Generated by AgentKit • 2:34</text>
      
      <!-- Play button -->
      <g transform="translate(340, 210)">
        <circle cx="0" cy="0" r="56" fill="rgba(255, 255, 255, 0.95)" stroke="#e2e8f0" stroke-width="2"/>
        <circle cx="0" cy="0" r="56" fill="none" stroke="url(#activeGradient)" stroke-width="2" opacity="0.6">
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
        </circle>
        <path d="M-18 -22 L22 0 L-18 22 Z" fill="#0f172a"/>
      </g>
    </g>
    
    <!-- Timeline section -->
    <g transform="translate(24, 520)">
      <rect x="0" y="0" width="680" height="56" rx="14" fill="#f1f5f9"/>
      <rect x="20" y="20" width="640" height="16" rx="8" fill="#e2e8f0"/>
      <rect x="20" y="20" width="520" height="16" rx="8" fill="url(#activeGradient)"/>
      <circle cx="540" cy="28" r="10" fill="#10b981" stroke="white" stroke-width="3" filter="url(#emeraldGlow)"/>
      <text x="20" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64748b">2:05</text>
      <text x="640" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64748b">2:34</text>
    </g>
    
    <!-- Playback controls -->
    <g transform="translate(324, 588)">
      <circle cx="0" cy="0" r="22" fill="#e2e8f0"/>
      <path d="M-8 0 L8 0" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
      <circle cx="50" cy="0" r="24" fill="#10b981" filter="url(#emeraldGlow)"/>
      <path d="M42 -8 L42 8 M58 -8 L58 8" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="100" cy="0" r="22" fill="#e2e8f0"/>
      <path d="M92 0 L108 0" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    </g>
    
    <!-- Settings Panel -->
    <g transform="translate(720, 88)">
      <rect x="0" y="0" width="256" height="520" rx="16" fill="white" stroke="#e2e8f0" stroke-width="1"/>
      <text x="20" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a">Generation Settings</text>
      
      <!-- Setting items -->
      <g transform="translate(16, 56)">
        <rect x="0" y="0" width="224" height="48" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="14" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">Resolution</text>
        <text x="175" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#0f172a">4K UHD</text>
      </g>
      
      <g transform="translate(16, 112)">
        <rect x="0" y="0" width="224" height="48" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="14" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">Duration</text>
        <text x="185" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#0f172a">2:34</text>
      </g>
      
      <g transform="translate(16, 168)">
        <rect x="0" y="0" width="224" height="48" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="14" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">Style</text>
        <text x="160" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#0f172a">Cinematic</text>
      </g>
      
      <g transform="translate(16, 224)">
        <rect x="0" y="0" width="224" height="48" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="14" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">Voice</text>
        <text x="170" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#0f172a">Natural</text>
      </g>
      
      <!-- Progress section -->
      <g transform="translate(16, 296)">
        <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a">Progress</text>
        <rect x="0" y="32" width="224" height="10" rx="5" fill="#e2e8f0"/>
        <rect x="0" y="32" width="190" height="10" rx="5" fill="url(#activeGradient)"/>
        <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#059669" font-weight="500">85% • Rendering frames...</text>
      </g>
      
      <!-- Action buttons -->
      <g transform="translate(16, 380)">
        <rect x="0" y="0" width="108" height="44" rx="10" fill="#e2e8f0"/>
        <text x="54" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#475569" text-anchor="middle">Preview</text>
        
        <rect x="116" y="0" width="108" height="44" rx="10" fill="#10b981" filter="url(#emeraldGlow)"/>
        <text x="170" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">Export</text>
      </g>
    </g>
    
    <!-- Frame thumbnails -->
    <g transform="translate(24, 620)">
      <rect x="0" y="0" width="952" height="60" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="-14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#0f172a">Generated Frames</text>
      
      <g transform="translate(16, 8)">
        <rect x="0" y="0" width="96" height="44" rx="8" fill="url(#frameGradient)" stroke="#a7f3d0" stroke-width="1"/>
        <text x="48" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#059669" text-anchor="middle">00:00</text>
        
        <rect x="108" y="0" width="96" height="44" rx="8" fill="url(#frameGradient)" stroke="#a7f3d0" stroke-width="1"/>
        <text x="156" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#059669" text-anchor="middle">00:30</text>
        
        <rect x="216" y="0" width="96" height="44" rx="8" fill="url(#frameGradient)" stroke="#a7f3d0" stroke-width="1"/>
        <text x="264" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#059669" text-anchor="middle">01:00</text>
        
        <rect x="324" y="0" width="96" height="44" rx="8" fill="url(#videoGradient)" stroke="#10b981" stroke-width="2"/>
        <text x="372" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="white" font-weight="500" text-anchor="middle">01:30</text>
        <rect x="324" y="0" width="96" height="44" rx="8" fill="none" stroke="#10b981" stroke-width="2" opacity="0.5">
          <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
        </rect>
        
        <rect x="432" y="0" width="96" height="44" rx="8" fill="url(#frameGradient)" stroke="#a7f3d0" stroke-width="1"/>
        <text x="480" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#059669" text-anchor="middle">02:00</text>
        
        <rect x="540" y="0" width="96" height="44" rx="8" fill="url(#frameGradient)" stroke="#a7f3d0" stroke-width="1"/>
        <text x="588" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#059669" text-anchor="middle">02:34</text>
      </g>
    </g>
  </g>
  
  <!-- Floating feature cards -->
  <g transform="translate(40, 200)">
    <rect x="0" y="0" width="200" height="160" rx="18" fill="white" filter="url(#premiumShadow)" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="2" y="2" width="196" height="156" rx="16" fill="none" stroke="rgba(16, 185, 129, 0.15)" stroke-width="1"/>
    <text x="20" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a">Video Engines</text>
    <g transform="translate(20, 60)">
      <circle cx="8" cy="8" r="7" fill="url(#logoGradient)"/>
      <text x="24" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">Remotion</text>
    </g>
    <g transform="translate(20, 90)">
      <circle cx="8" cy="8" r="7" fill="url(#logoGradient)"/>
      <text x="24" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">FFmpeg</text>
    </g>
    <g transform="translate(20, 120)">
      <circle cx="8" cy="8" r="7" fill="url(#logoGradient)"/>
      <text x="24" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">WebGL</text>
    </g>
  </g>
  
  <g transform="translate(1460, 320)">
    <rect x="0" y="0" width="220" height="220" rx="18" fill="white" filter="url(#premiumShadow)" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="2" y="2" width="216" height="216" rx="16" fill="none" stroke="rgba(16, 185, 129, 0.15)" stroke-width="1"/>
    <text x="20" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f172a">AI Capabilities</text>
    <g transform="translate(20, 60)">
      <circle cx="8" cy="8" r="7" fill="url(#logoGradient)"/>
      <text x="24" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">Chat Interface</text>
    </g>
    <g transform="translate(20, 90)">
      <circle cx="8" cy="8" r="7" fill="url(#logoGradient)"/>
      <text x="24" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">Web Search</text>
    </g>
    <g transform="translate(20, 120)">
      <circle cx="8" cy="8" r="7" fill="url(#logoGradient)"/>
      <text x="24" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">Script Generation</text>
    </g>
    <g transform="translate(20, 150)">
      <circle cx="8" cy="8" r="7" fill="url(#logoGradient)"/>
      <text x="24" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">Voice Synthesis</text>
    </g>
    <g transform="translate(20, 180)">
      <circle cx="8" cy="8" r="7" fill="url(#logoGradient)"/>
      <text x="24" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">Visual Effects</text>
    </g>
  </g>
  
  <!-- Connection lines with nodes -->
  <path d="M240 280 C300 280, 350 350, 484 400" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5" stroke-dasharray="8,4" fill="none"/>
  <circle cx="240" cy="280" r="6" fill="#10b981" filter="url(#emeraldGlow)"/>
  <circle cx="484" cy="400" r="6" fill="#10b981"/>
  
  <path d="M1460 430 C1400 430, 1400 480, 1460 480" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5" stroke-dasharray="8,4" fill="none"/>
  <circle cx="1460" cy="430" r="6" fill="#10b981" filter="url(#emeraldGlow)"/>
  <circle cx="1460" cy="480" r="6" fill="#10b981"/>
</svg>
